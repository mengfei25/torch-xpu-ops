name: XPU Runner Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: container smoke ${{ matrix.executor }}
    runs-on: [self-hosted, ubuntu-24.04]
    strategy:
      fail-fast: false
      matrix:
        executor: [1, 2, 3, 4]
    steps:
      - name: Show executor environment
        run: |
          set -euxo pipefail
          cat /etc/os-release
          uname -a
          id
          nproc
          df -h .
          echo "executor=${{ matrix.executor }}"
          sleep 60
