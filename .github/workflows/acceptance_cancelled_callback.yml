name: Acceptance Cancelled Callback

# Safety net for the event-driven PR check: `report-back` inside
# acceptance_ondemand.yml is itself skipped when the run is cancelled (e.g. by
# concurrency). This handler fires on run completion and, only for the
# `cancelled` conclusion, notifies the caller so its check does not hang
# in-progress. Success/failure are already handled by report-back.

on:
  workflow_run:
    workflows: ["OnDemand Acceptance Comparison"]
    types: [completed]

permissions:
  actions: read

jobs:
  notify-cancelled:
    name: notify cancelled
    if: ${{ github.event.workflow_run.conclusion == 'cancelled' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download callback info
        id: dl
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: acceptance-callback-info
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Dispatch cancelled result to caller
        env:
          GH_TOKEN: ${{ secrets.ONEDNN_DISPATCH_TOKEN }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          [ -f callback.json ] || { echo "No callback info artifact; nothing to do."; exit 0; }
          repo=$(jq -r '.callback_repo // empty' callback.json)
          [ -n "$repo" ] || { echo "No callback_repo; nothing to do."; exit 0; }
          jq -c --arg url "$RUN_URL" \
            '{event_type:"acceptance-result", client_payload:(. + {conclusion:"cancelled", run_url:$url})}' \
            callback.json | gh api -X POST "repos/${repo}/dispatches" --input -
