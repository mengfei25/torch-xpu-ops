name: Linux PyTorch XPU Build

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
        description: Runner label for build job
      pytorch:
        type: string
        default: 'main'
        description: Pytorch main by default, or 'commit/branch', or 'repo@commit/repo@branch'
      torch_xpu_ops:
        type: string
        default: 'main'
        description: Torch-xpu-ops main by default, 'commit/branch', or 'repo@commit/repo@branch', or 'pinned' for pytorch pin
      triton:
        required: false
        type: string
        default: ''
        description: Triton pinned by pytorch by default, or 'commit/branch', or 'repo@commit/repo@branch'
      onednn:
        required: false
        type: string
        default: ''
        description: 'oneDNN ref (commit/branch/tag) or `repo@ref`. Empty/`pinned` keeps pytorch default.'
      python:
        type: string
        default: '3.10'
        description: Python version
      category:
        type: string
        default: ''
        description: 'Optional artifact tag; also selects known-failure label scope (dpclang enables skipped_dpclang)'

permissions: read-all

defaults:
  run:
    shell: bash -xe {0}
env:
  DOCKER_REGISTRY_AUTH_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}

jobs:
  build:
    name: ${{ inputs.pytorch }}
    if: ${{ ! endsWith(inputs.pytorch, '_wheel') }}
    runs-on: ${{ inputs.runner }}
    container:
      image: 'pytorch/manylinux2_28-builder:xpu-main'
      volumes:
        - ${{ github.workspace }}:${{ github.workspace }}
      env:
        PATH: /tmp/xpu-tool/myvenv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        PIP_CACHE_DIR: /tmp/xpu-tool/.pipcache
    env:
      GH_TOKEN: ${{ github.token }}
    timeout-minutes: 300
    steps:
      - name: Install gh-cli
        run: |
          cat /etc/os-release
          hostname && id
          # install gh
          dnf install -y 'dnf-command(config-manager)'
          dnf config-manager --add-repo https://cli.github.com/packages/rpm/gh-cli.repo
          dnf install -y gh --repo gh-cli
          gh --version
          # cleanup files
          rm -rf ${{ github.workspace }}/*.whl ${{ github.workspace }}/*.log
          set +x
          wget --no-proxy --no-check-certificate -q http://10.239.177.6/tmp-file -O ~/.netrc
          chmod 600 ~/.netrc
      - name: Install DLE
        run: |
          rm -rf /opt/intel/oneapi intel-deep-learning-essentials-2026.2.0.466_offline.sh linux_qa_release.tgz
          wget --no-proxy --no-check-certificate -q http://10.239.177.6/pytorch/xpu/bundle/intel-deep-learning-essentials-2026.2.0.466_offline.sh
          bash intel-deep-learning-essentials-2026.2.0.466_offline.sh -a -s --eula accept --install-dir /opt/intel/oneapi --action remove || true
          bash intel-deep-learning-essentials-2026.2.0.466_offline.sh -a -s --eula accept --install-dir /opt/intel/oneapi --action install
          bash intel-deep-learning-essentials-2026.2.0.466_offline.sh -a -s --eula accept --install-dir /opt/intel/oneapi --action repair
          wget --no-proxy --no-check-certificate -q -O linux_qa_release.tgz http://10.239.177.6/pytorch/xpu/bundle/compiler_20260903_160000/linux_qa_release.tgz
          rm -rf /opt/intel/oneapi/compiler/20260903_160000 && mkdir -p /opt/intel/oneapi/compiler/20260903_160000
          tar -xzf linux_qa_release.tgz -C /opt/intel/oneapi/compiler/20260903_160000
          rm -rf /opt/intel/oneapi/compiler/*
          ln -sf /opt/intel/oneapi/compiler/20260903_160000 /opt/intel/oneapi/compiler/latest
          ln -sf /opt/intel/oneapi/compiler/20260903_160000 /opt/intel/oneapi/compiler/2026.2
          echo "XPU_ONEAPI_PATH=/opt/intel/oneapi" >> ${GITHUB_ENV}
          set +x
          source /opt/intel/oneapi/setvars.sh
          which icpx
          icpx --version
      - name: Setup python-${{ inputs.python }}
        run: |
          rm -rf /tmp/xpu-tool/myvenv
          local_python=$(echo ${{ inputs.python }} |awk -F. '{printf("cp%s%s-cp%s%s", $1, $2, $1, $2)}')
          /opt/python/${local_python}/bin/python -m venv /tmp/xpu-tool/myvenv
          which python && python -V
          which pip && pip list
          pip install -U pip wheel "setuptools<81"
      - name: Checkout torch-xpu-ops
        uses: actions/checkout@v7
        with:
          path: torch-xpu-ops
      - name: Snapshot open skipped issues at build start
        run: |
          touch known_issue_static.log issues_snapshot.log issues_snapshot_bmg.log issues_snapshot_dpclang.log
          bash torch-xpu-ops/.github/scripts/fetch_issues.sh static > known_issue_static.log
          bash torch-xpu-ops/.github/scripts/fetch_issues.sh open "${{ inputs.category }}" > issues_snapshot.log
          # Runner/category specific labels snapshotted separately so the summary job
          # only applies them on the matching runner (avoids masking failures elsewhere).
          bash torch-xpu-ops/.github/scripts/fetch_issues.sh open "" "bmg-test" "extra-only" > issues_snapshot_bmg.log
          bash torch-xpu-ops/.github/scripts/fetch_issues.sh open "dpclang" "" "extra-only" > issues_snapshot_dpclang.log
      - name: Upload skipped issues snapshot
        if: ${{ ! cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: Skipped-Issues-Snapshot-${{ github.event.pull_request.number || github.sha }}-linux-build-start
          path: |
            known_issue_static.log
            issues_snapshot.log
            issues_snapshot_bmg.log
            issues_snapshot_dpclang.log
      - name: Download dpclang
        if: ${{ inputs.category == 'dpclang' }}
        uses: actions/download-artifact@v8
        with:
          name: dpclang
      # NOTE: placement of this step is important as some environment variables it sets
      # might be overriden or reset by certain actions. For example, PKG_CONFIG_PATH is
      # overriden by actions/setup-python.
      - name: Setup dpclang
        if: ${{ inputs.category == 'dpclang' }}
        run: |
          rm -rf install-dpclang && mkdir install-dpclang
          tar xzvf install-dpclang.tgz -C install-dpclang
          echo "CMAKE_PREFIX_PATH=$(pwd)/install-dpclang" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$(pwd)/install-dpclang/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$(pwd)/install-dpclang/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV
          echo "PATH=$(pwd)/install-dpclang/bin:$PATH" >> $GITHUB_ENV
          echo "USE_DPCLANG=yes" >> $GITHUB_ENV
          echo "$(pwd)/install-dpclang/bin" >> $GITHUB_PATH
      - name: Prepare Pytorch Source
        run: |
          if [[ "${{ inputs.pytorch }}" == *"https://"* ]];then
            PYTORCH_REPO="$(echo ${{ inputs.pytorch }} |sed 's/@.*//')"
            PYTORCH_COMMIT="$(echo ${{ inputs.pytorch }} |sed 's/.*@//')"
          else
            PYTORCH_REPO="https://github.com/pytorch/pytorch.git"
            PYTORCH_COMMIT="${{ inputs.pytorch }}"
          fi
          if [[ "${{ inputs.torch_xpu_ops }}" == *"https://"* ]];then
            TORCH_XPU_OPS_REPO="$(echo ${{ inputs.torch_xpu_ops }} |sed 's/@.*//')"
            TORCH_XPU_OPS_COMMIT="$(echo ${{ inputs.torch_xpu_ops }} |sed 's/.*@//')"
          else
            TORCH_XPU_OPS_REPO="https://github.com/intel/torch-xpu-ops.git"
            TORCH_XPU_OPS_COMMIT="${{ inputs.torch_xpu_ops }}"
          fi
          python ${{ github.workspace }}/torch-xpu-ops/.github/scripts/prepare_pytorch.py \
            --workspace="${{ github.workspace }}" \
            --pytorch-repo="${PYTORCH_REPO}" \
            --pytorch-commit="${PYTORCH_COMMIT}" \
            --torch-xpu-ops-repo="${TORCH_XPU_OPS_REPO}" \
            --torch-xpu-ops-commit="${TORCH_XPU_OPS_COMMIT}" \
            --onednn-commit='${{ inputs.onednn }}'
      - name: Build Pytorch
        run: |
          export USE_XCCL=1
          export IS_XPU_CI=1
          # PR CI needs pvc (e2e/perf jobs) and bmg (UT jobs) AOT targets.
          if [ "${{ github.event_name }}" == "pull_request" ];then
            export TORCH_XPU_ARCH_LIST='pvc,bmg'
          fi
          # gcc 13
          source /opt/rh/gcc-toolset-13/enable
          ${{ github.workspace }}/torch-xpu-ops/.github/scripts/build.sh \
            --WORKSPACE="${{ github.workspace }}" \
            2>&1 |tee ${{ github.workspace }}/build_pytorch.log
          if [ $(ls ${{ github.workspace }} |grep -c "torch-.*.whl") -eq 0 ];then
            echo "Build pytorch got failed"
            exit 1
          fi
      - name: Torch Config
        run: |
          printenv
          source /opt/intel/oneapi/setvars.sh
          python -c "import torch; print(torch.__config__.show())"
          python -c "import torch; print(torch.__config__.parallel_info())"
          python -c "import torch; print(torch.__config__.torch.xpu.device_count())"
          python pytorch/torch/utils/collect_env.py
          pip list |grep -E 'torch|intel'
          rm -rf ~/.netrc
      - name: Upload Torch XPU Wheel
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: Torch-XPU-Wheel-${{ github.event.pull_request.number || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}${{ inputs.category != '' && format('-{0}', inputs.category) || '' }}
          path: ${{ github.workspace }}/*.whl
      - name: Upload Build Log
        if: ${{ ! cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: Torch-XPU-Build-Log-${{ github.event.pull_request.number || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}${{ inputs.category != '' && format('-{0}', inputs.category) || '' }}
          path: ${{ github.workspace }}/build_*.log
      - name: Cleanup workspace
        if: ${{ always() }}
        run: |
          chmod 777 /__w /github ./ -R

  build-status-check:
    needs: [build]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check build result
        run: |
          result="${{ needs.build.result }}"
          echo "build result: $result"
          if [ "$result" = "skipped" ]; then
            echo "build was skipped, marking as pass"
            exit 0
          elif [ "$result" = "success" ]; then
            echo "build passed"
            exit 0
          else
            echo "build failed with result: $result"
            exit 1
          fi
